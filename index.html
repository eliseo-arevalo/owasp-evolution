<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Explorador interactivo de la evolución del OWASP Top 10 para aplicaciones web y sistemas GenAI/LLM.">
  <meta property="og:title" content="OWASP Evolution">
  <meta property="og:description" content="Explorador interactivo de la evolución del OWASP Top 10 para aplicaciones web y sistemas GenAI/LLM.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#111111">
  <title>OWASP Evolution</title>
  <script>
    (() => {
      document.documentElement.classList.add('js', 'booting');
      const root = document.documentElement;
      const deepDetail = /\/\d{4}\/[^/]+/.test(location.pathname) || /\/detalle$/.test(location.hash);
      let open = true;
      const desktop = { side: 'left', width: 380 };
      const narrow = matchMedia('(max-width: 640px), (pointer: coarse) and (max-width: 960px) and (max-height: 500px)').matches;
      try {
        open = localStorage.getItem('owasp-detail-open') !== 'false';
        const saved = JSON.parse(localStorage.getItem('owasp-dock-layout') || '{}');
        for (const [dock, value] of [[desktop, saved.desktop]]) {
          if (!value) continue;
          if (['left', 'right'].includes(value.side)) dock.side = value.side;
          for (const size of ['width']) if (Number.isFinite(value[size]) && value[size] > 0) dock[size] = value[size];
        }
        if (!saved.desktop) desktop.side = localStorage.getItem('owasp-dock') || 'left';
      } catch {}
      const requestedDock = new URLSearchParams(location.search).get('dock');
      if (requestedDock) desktop.side = requestedDock === 'right' ? 'right' : 'left';
      // A legacy matrix hash explicitly requests a selection without detail.
      if (!narrow && (deepDetail || (open && !location.hash.startsWith('#/')))) {
        const dock = desktop;
        const side = ['left', 'right'].includes(dock.side) ? dock.side : 'left';
        const size = dock.width;
        root.dataset.initialDetail = 'true';
        root.dataset.initialDock = side;
        root.style.setProperty('--initial-dock-size', `${Number.isFinite(size) && size > 0 ? size : 380}px`);
      }
      let theme = 'system';
      try { theme = localStorage.getItem('owasp-theme') || 'system'; } catch {}
      if (!['dark', 'light', 'system'].includes(theme)) theme = 'system';
      document.documentElement.dataset.themePreference = theme;
      document.documentElement.dataset.theme = theme === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === 'dark' ? '#111111' : '#f7f7f7';
    })();
  </script>
  <link rel="preload" href="/assets/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#timeline">Saltar al explorador</a>

  <header class="topbar">
    <div class="header-context">
    <a class="brand" href="/" aria-label="OWASP Evolution, inicio">
      <span>OWASP Evolution</span>
    </a>
    <nav class="family-nav" aria-label="Familia de riesgos" id="family-nav" data-segment="0"></nav>
    </div>
    <div class="header-meta">
      <a class="support-button" href="https://ko-fi.com/oclazi" target="_blank" rel="noopener" aria-label="Invítame un café" data-tooltip="Invítame un café"><span data-support-icon aria-hidden="true"></span></a>
      <div class="search-wrap">
        <label for="risk-search">Buscar categoría, identificador o concepto</label>
        <div class="search-control">
          <svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
          <input id="risk-search" type="search" autocomplete="off" placeholder="Buscar categorías">
        </div>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div id="export-slot"><button class="export-button" type="button" disabled>Exportar</button></div>
      <div class="language-control segmented" id="language-select" data-segment="0" role="radiogroup" aria-label="Idioma">
        <button type="button" role="radio" data-language="es" aria-checked="true" tabindex="0">ES</button>
        <button type="button" role="radio" data-language="en" aria-checked="false" tabindex="-1">EN</button>
      </div>
      <div class="theme-control menu-control">
        <span class="sr-only" id="theme-label">Tema</span>
        <button id="theme-select" type="button" aria-labelledby="theme-label theme-value" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
          <span id="theme-value">Sistema</span><span aria-hidden="true">⌄</span>
        </button>
        <div id="theme-menu" class="control-menu" role="menu" aria-labelledby="theme-select" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-theme-choice="system">Sistema</button>
          <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-theme-choice="dark">Oscuro</button>
          <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-theme-choice="light">Claro</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h1 class="sr-only" id="explorer-heading">OWASP Evolution</h1>
    <div id="matrix-page">
    <section class="toolbar" aria-label="Herramientas del explorador">
      <fieldset class="edition-filter" id="edition-filter"><legend>Ediciones</legend><div id="edition-options"></div><span id="edition-feedback" class="edition-feedback" role="status"></span></fieldset>
      <div class="legend" role="group" aria-label="Leyenda de relaciones">
        <span><i class="legend-line line-continues"></i><span class="legend-full">Continúa / se mueve</span><span class="legend-short">Continúa</span></span>
        <span><i class="legend-line line-renamed"></i><span class="legend-full">Se renombra</span><span class="legend-short">Renombra</span></span>
        <span><i class="legend-line line-merged"></i><span class="legend-full">Se fusiona / amplía</span><span class="legend-short">Fusiona</span></span>
      </div>
    </section>

    <section class="explorer-shell" data-dock="left">
      <div class="timeline-panel" id="timeline" tabindex="-1">
        <div class="timeline-scroll" id="timeline-scroll" tabindex="0" aria-label="Matriz de evolución de categorías">
          <div class="timeline-stage" id="timeline-stage">
            <svg class="connector-layer" id="connector-layer" aria-hidden="true"></svg>
            <div class="timeline-grid" id="timeline-grid"></div>
          </div>
        </div>
      </div>

      <dialog class="detail-modal" id="detail-modal" role="dialog" aria-labelledby="detail-title">
        <div class="dock-resizer" id="dock-resizer" role="separator" tabindex="0" aria-controls="timeline detail-modal" aria-label="Cambiar tamaño del panel" aria-orientation="vertical" aria-valuemin="240" aria-valuemax="600" aria-valuenow="320"></div>
        <article class="detail-page" id="detail-page"></article>
      </dialog>
    </section>
    </div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
